# Test Environment Configuration
# Provides test JWT secret and H2 in-memory database configuration for unit & integration tests
app.jwt.secret=UrbanAssistTestSecretKeyMustBeAtLeast32BytesLongForTesting2026!
app.jwt.expiration-ms=86400000

spring.datasource.url=jdbc:h2:mem:urbanassist_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
