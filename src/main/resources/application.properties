# ==============================================================================
# UrbanAssist Backend — Application Configuration
# ==============================================================================

# Application & Server Configuration
spring.application.name=UrbanAssist
server.port=${SERVER_PORT:8080}

# ------------------------------------------------------------------------------
# Database Connection (Aiven MySQL Cloud Database / H2 Local Dev Fallback)
# ------------------------------------------------------------------------------
# To connect to Aiven MySQL, set these environment variables before starting:
#
#   $env:AIVEN_DB_URL      = "jdbc:mysql://<host>:<port>/defaultdb?sslMode=REQUIRED"
#   $env:AIVEN_DB_USER     = "avnadmin"
#   $env:AIVEN_DB_PASSWORD = "<your-aiven-password>"
#
# When AIVEN_DB_URL is NOT set, the application uses H2 in-memory (local dev only).
# When AIVEN_DB_URL IS set and the connection fails, startup fails immediately with
# a clear error (no silent fallback to H2 in production).
# ------------------------------------------------------------------------------
spring.datasource.url=${AIVEN_DB_URL:jdbc:h2:mem:urbanassist_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${AIVEN_DB_USER:sa}
spring.datasource.password=${AIVEN_DB_PASSWORD:}

# Driver class is inferred automatically from the URL prefix (jdbc:mysql vs jdbc:h2).
# Explicitly set ONLY if auto-detection fails:
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Pool Configuration
# connection-timeout: max wait for a free connection from the pool (ms)
# keepalive-time: sends keep-alive probes to prevent idle MySQL connections timing out
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=60000

# H2 Console (enabled for dev inspection when running with in-memory DB)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ------------------------------------------------------------------------------
# JPA / Hibernate Settings
# ------------------------------------------------------------------------------
# 'update' creates or updates table schema safely without dropping existing data.
# Never use 'create' or 'create-drop' with Aiven — it will DELETE all tables.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# MySQL dialect is auto-detected from the JDBC URL. Uncomment ONLY if needed:
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ------------------------------------------------------------------------------
# JWT Configuration
# ------------------------------------------------------------------------------
# Set JWT_SECRET in production. Uses a 64-character default for local development.
app.jwt.secret=${JWT_SECRET:UrbanAssistDevDefaultSecretKey2026MustBeAtLeast32BytesLongForSecurity!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ------------------------------------------------------------------------------
# Hugging Face AI Configuration
# ------------------------------------------------------------------------------
ai.huggingface.api-key=${HF_API_KEY:}
ai.huggingface.model-url=${HF_MODEL_URL:https://api-inference.huggingface.co/models/facebook/bart-large-mnli}

# ------------------------------------------------------------------------------
# File Upload Settings
# ------------------------------------------------------------------------------
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB
